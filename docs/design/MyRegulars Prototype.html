<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MyRegulars — Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
  <style>
    html, body { margin: 0; padding: 0; background: #efeee8; height: 100%; }
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="mr-shared.jsx"></script>
  <script type="text/babel" src="mr-mobile.jsx"></script>
  <script type="text/babel" src="mr-mobile-detail.jsx"></script>
  <script type="text/babel" src="mr-desktop.jsx"></script>
  <script type="text/babel" src="mr-app.jsx"></script>
  <script type="text/babel">
    // Mount once all babel scripts are evaluated.
    const mount = () => {
      if (!window.MyRegulars) { setTimeout(mount, 30); return; }
      ReactDOM.createRoot(document.getElementById('root')).render(<MyRegulars />);
    };
    mount();
  </script>
</body>
</html>
