name: Deploy PocketBase

# Pushes the committed migrations and hooks to the PocketHost instance named in
# pocketbase/.phioconfig whenever they change on main, using PocketHost's phio CLI over
# SFTP. Hooks reload live; migrations apply on the instance's next start, so the
# job ends by waking the instance and reminding you to power-cycle it from the
# PocketHost dashboard when a migration shipped.
#
# Secrets (production environment):
#   PB_SUPERUSER_EMAIL / PB_SUPERUSER_PASSWORD — the PocketHost account login
#     (the same pair .env.local uses), for a non-interactive `phio` session.
#   PHIO_DEPLOY_KEY (optional) — an OpenSSH ed25519 private key phio already
#     registered on the account (run `npx phio login` locally, then copy the
#     `phio_deploy_ed25519` file from the directory `npx phio info` prints).
#     Without it phio generates and registers a fresh key on every run.
# Variable: NEXT_PUBLIC_POCKETBASE_URL — the instance URL, for the wake-up ping.

on:
  push:
    branches: [main]
    paths:
      - "pocketbase/pb_migrations/**"
      - "pocketbase/pb_hooks/**"
      - "pocketbase/.phioconfig"
  workflow_dispatch:

concurrency:
  group: deploy-pocketbase
  cancel-in-progress: false

jobs:
  pockethost:
    name: PocketHost files
    runs-on: ubuntu-latest
    environment: production
    env:
      PHIO_HOME: ${{ runner.temp }}/phio
      # The `secrets` context is not allowed in step `if:` conditions, so the
      # optional key is lifted into job env and the step tests `env` instead.
      PHIO_DEPLOY_KEY: ${{ secrets.PHIO_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      # phio needs Node 24+ (it ships TypeScript sources).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install --no-audit --no-fund

      - name: Restore the deploy key (optional)
        if: ${{ env.PHIO_DEPLOY_KEY != '' }}
        run: |
          mkdir -p "$PHIO_HOME"
          printf '%s\n' "$PHIO_DEPLOY_KEY" > "$PHIO_HOME/phio_deploy_ed25519"
          chmod 600 "$PHIO_HOME/phio_deploy_ed25519"
          ssh-keygen -y -f "$PHIO_HOME/phio_deploy_ed25519" > "$PHIO_HOME/phio_deploy_ed25519.pub"

      - name: Deploy pb_migrations + pb_hooks with phio
        run: npm run pb:deploy
        env:
          PHIO_USERNAME: ${{ secrets.PB_SUPERUSER_EMAIL }}
          PHIO_PASSWORD: ${{ secrets.PB_SUPERUSER_PASSWORD }}

      - name: Wake the instance
        run: |
          curl -fsS --max-time 30 "${{ vars.NEXT_PUBLIC_POCKETBASE_URL }}/api/health" || true
          echo "::notice::If a migration changed, power-cycle the instance from the PocketHost dashboard so it runs."
