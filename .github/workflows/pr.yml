name: PR

on:
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Use `npm install` rather than `npm ci`: the lockfile's wasm-fallback
      # optional deps (@napi-rs/wasm-runtime / @emnapi/*, pulled in transitively)
      # resolve to different versions across OS/arch, so a macOS-generated lock
      # fails `npm ci`'s strict sync check on the Linux runner. `npm install`
      # re-resolves per platform.
      - run: npm install --no-audit --no-fund
      - run: npm run validate
      # Install the browser + its OS dependencies for headless Chromium on CI.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
