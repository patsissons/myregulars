name: PR

on:
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json

      - run: npm ci
      - run: npm run validate
      - run: npm run test:e2e
